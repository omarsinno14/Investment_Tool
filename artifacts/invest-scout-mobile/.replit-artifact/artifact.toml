kind = "mobile"
previewPath = "/mobile"
title = "Vertica Mobile"
version = "1.0.0"
id = "artifacts/invest-scout-mobile"
router = "path"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/mobile" ]
localPort = 18547

[services.development]
run = "pnpm --filter @workspace/invest-scout-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/invest-scout-mobile", "run", "build" ]
run = "pnpm --filter @workspace/invest-scout-mobile run serve"

[services.env]
PORT = "18547"
